<!-- Dark mode for the PicoClaw docs (GitHub Pages / jekyll-theme-primer). -->
<style>
  :root {
    color-scheme: light dark;
  }

  html[data-theme="dark"] {
    color-scheme: dark;
  }

  html[data-theme="dark"] body {
    color: #e6e6e6;
    background-color: #000000;
  }

  html[data-theme="dark"] a,
  html[data-theme="dark"] .markdown-body a {
    color: #e6e6e6;
    text-decoration: underline;
  }

  html[data-theme="dark"] .markdown-body h1,
  html[data-theme="dark"] .markdown-body h2 {
    border-bottom-color: #2a2a2a;
  }

  html[data-theme="dark"] .markdown-body h6 {
    color: #9a9a9a;
  }

  html[data-theme="dark"] .markdown-body hr {
    background-color: #2a2a2a;
  }

  html[data-theme="dark"] .markdown-body blockquote {
    color: #9a9a9a;
    border-left-color: #2a2a2a;
  }

  html[data-theme="dark"] .markdown-body table th,
  html[data-theme="dark"] .markdown-body table td {
    border-color: #2a2a2a;
  }

  html[data-theme="dark"] .markdown-body table tr {
    background-color: #000000;
    border-top-color: #2a2a2a;
  }

  html[data-theme="dark"] .markdown-body table tr:nth-child(2n) {
    background-color: #111111;
  }

  html[data-theme="dark"] .markdown-body code,
  html[data-theme="dark"] .markdown-body tt {
    background-color: rgba(255, 255, 255, 0.1);
    color: #e6e6e6;
  }

  html[data-theme="dark"] .markdown-body pre,
  html[data-theme="dark"] .highlight pre {
    background-color: #111111;
    color: #e6e6e6;
  }

  html[data-theme="dark"] .markdown-body pre code,
  html[data-theme="dark"] .markdown-body pre tt,
  html[data-theme="dark"] .markdown-body pre > code {
    background-color: transparent;
    color: inherit;
    border: 0;
  }

  html[data-theme="dark"] .markdown-body .csv-data th {
    background: #111111;
  }

  html[data-theme="dark"] .border-gray-light {
    border-color: #2a2a2a !important;
  }

  html[data-theme="dark"] .text-gray {
    color: #9a9a9a !important;
  }

  /* Syntax highlighting (rouge) — neutral grayscale, no color except diffs. */
  html[data-theme="dark"] .highlight {
    color: #e6e6e6;
  }
  html[data-theme="dark"] .highlight .c,
  html[data-theme="dark"] .highlight .cm,
  html[data-theme="dark"] .highlight .c1,
  html[data-theme="dark"] .highlight .cs,
  html[data-theme="dark"] .highlight .cd {
    color: #6a6a6a;
    font-style: italic;
  }
  html[data-theme="dark"] .highlight .cp,
  html[data-theme="dark"] .highlight .gh {
    color: #9a9a9a;
  }
  html[data-theme="dark"] .highlight .k,
  html[data-theme="dark"] .highlight .kc,
  html[data-theme="dark"] .highlight .kd,
  html[data-theme="dark"] .highlight .kn,
  html[data-theme="dark"] .highlight .kp,
  html[data-theme="dark"] .highlight .kr,
  html[data-theme="dark"] .highlight .kv,
  html[data-theme="dark"] .highlight .kt {
    color: #ffffff;
    font-weight: 600;
  }
  html[data-theme="dark"] .highlight .m,
  html[data-theme="dark"] .highlight .mf,
  html[data-theme="dark"] .highlight .mh,
  html[data-theme="dark"] .highlight .mi,
  html[data-theme="dark"] .highlight .mo,
  html[data-theme="dark"] .highlight .il,
  html[data-theme="dark"] .highlight .mx {
    color: #cccccc;
  }
  html[data-theme="dark"] .highlight .s,
  html[data-theme="dark"] .highlight .sb,
  html[data-theme="dark"] .highlight .sc,
  html[data-theme="dark"] .highlight .sd,
  html[data-theme="dark"] .highlight .s1,
  html[data-theme="dark"] .highlight .s2,
  html[data-theme="dark"] .highlight .se,
  html[data-theme="dark"] .highlight .sh,
  html[data-theme="dark"] .highlight .si,
  html[data-theme="dark"] .highlight .sx,
  html[data-theme="dark"] .highlight .sr,
  html[data-theme="dark"] .highlight .ss {
    color: #b8b8b8;
  }
  html[data-theme="dark"] .highlight .na,
  html[data-theme="dark"] .highlight .nb,
  html[data-theme="dark"] .highlight .nc,
  html[data-theme="dark"] .highlight .nd,
  html[data-theme="dark"] .highlight .ne,
  html[data-theme="dark"] .highlight .nf,
  html[data-theme="dark"] .highlight .ni,
  html[data-theme="dark"] .highlight .nl,
  html[data-theme="dark"] .highlight .nn,
  html[data-theme="dark"] .highlight .no,
  html[data-theme="dark"] .highlight .nt,
  html[data-theme="dark"] .highlight .nv {
    color: #f0f0f0;
  }
  html[data-theme="dark"] .highlight .gd {
    color: #ffa198;
    background-color: #1a0000;
  }
  html[data-theme="dark"] .highlight .gi {
    color: #7ee787;
    background-color: #001a00;
  }
  html[data-theme="dark"] .highlight .gt {
    color: #ffa198;
  }
  html[data-theme="dark"] .highlight .err {
    color: #ffa198;
    background-color: transparent;
  }

  /* Toggle button */
  .theme-toggle {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 100;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    padding: 0;
    cursor: pointer;
    color: #24292e;
    background-color: #f6f8fa;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    line-height: 1;
  }

  .theme-toggle:hover {
    background-color: #eaecef;
  }

  .theme-toggle svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  .theme-toggle .icon-sun {
    display: none;
  }

  html[data-theme="dark"] .theme-toggle {
    color: #e6e6e6;
    background-color: #111111;
    border-color: #2a2a2a;
  }

  html[data-theme="dark"] .theme-toggle:hover {
    background-color: #1c1c1c;
  }

  html[data-theme="dark"] .theme-toggle .icon-moon {
    display: none;
  }

  html[data-theme="dark"] .theme-toggle .icon-sun {
    display: block;
  }
</style>

<script>
  (function () {
    var STORAGE_KEY = "picoclaw-theme";
    var stored = null;
    try {
      stored = window.localStorage.getItem(STORAGE_KEY);
    } catch (e) {
      stored = null;
    }
    var prefersDark =
      window.matchMedia &&
      window.matchMedia("(prefers-color-scheme: dark)").matches;
    var theme = stored || (prefersDark ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);

    window.addEventListener("DOMContentLoaded", function () {
      var button = document.createElement("button");
      button.type = "button";
      button.className = "theme-toggle";
      button.setAttribute("aria-label", "Toggle dark mode");
      button.title = "Toggle dark mode";
      button.innerHTML =
        '<svg class="icon-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.598 1.591a.749.749 0 0 1 .785-.175 7.001 7.001 0 1 1-8.967 8.967.75.75 0 0 1 .96-.96 5.5 5.5 0 0 0 7.046-7.046.75.75 0 0 1 .176-.786Z"/></svg>' +
        '<svg class="icon-sun" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 12a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-1.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Zm0-10a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 8 .5Zm0 12.5a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 8 13Zm7.25-5a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1 0-1.5h1.5a.75.75 0 0 1 .75.75ZM3 8a.75.75 0 0 1-.75.75H.75a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 3 8Zm9.03-4.97a.75.75 0 0 1 0 1.06l-1.06 1.06a.75.75 0 1 1-1.06-1.06l1.06-1.06a.75.75 0 0 1 1.06 0ZM5.09 9.85l-1.06 1.06a.75.75 0 1 1-1.06-1.06l1.06-1.06a.75.75 0 1 1 1.06 1.06Zm7.94 2.12a.75.75 0 0 1-1.06 1.06l-1.06-1.06a.75.75 0 1 1 1.06-1.06l1.06 1.06ZM5.09 6.15 4.03 5.09a.75.75 0 0 1 1.06-1.06l1.06 1.06a.75.75 0 0 1-1.06 1.06Z"/></svg>';

      button.addEventListener("click", function () {
        var next =
          document.documentElement.getAttribute("data-theme") === "dark"
            ? "light"
            : "dark";
        document.documentElement.setAttribute("data-theme", next);
        try {
          window.localStorage.setItem(STORAGE_KEY, next);
        } catch (e) {
          /* ignore */
        }
      });

      document.body.appendChild(button);
    });
  })();
</script>
