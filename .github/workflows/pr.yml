name: PR

on:
  pull_request: { }

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run go generate
        run: go generate ./...

      - name: Golangci Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --build-tags=goolm,stdjson

  vuln_check:
    name: Security Check
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=goolm,stdjson
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Run Govulncheck
        run: govulncheck -C . -format text ./...

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run go generate
        run: go generate ./...

      - name: Run go test
        run: go test -tags goolm,stdjson ./...

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Docker-backed integration suites
        run: bash ./scripts/run-integration-tests.sh

  runtime_benchmark:
    name: Runtime Footprint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Checkout base revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git worktree add --detach "$RUNNER_TEMP/picoclaw-base" "$BASE_SHA"

      - name: Build base and PR binaries
        env:
          BASE_DIR: ${{ runner.temp }}/picoclaw-base
          BIN_DIR: ${{ runner.temp }}/picoclaw-bench-bin
        run: |
          mkdir -p "$BIN_DIR"
          go generate ./...
          CGO_ENABLED=0 go build -trimpath -tags goolm,stdjson -o "$BIN_DIR/picoclaw-pr" ./cmd/picoclaw
          (
            cd "$BASE_DIR"
            go generate ./...
            CGO_ENABLED=0 go build -trimpath -tags goolm,stdjson -o "$BIN_DIR/picoclaw-base" ./cmd/picoclaw
          )

      - name: Compare runtime footprint
        env:
          BIN_DIR: ${{ runner.temp }}/picoclaw-bench-bin
          RESULTS_DIR: ${{ runner.temp }}/picoclaw-benchmark
        run: |
          set +e
          bash ./scripts/benchmark-runtime.sh \
            --base "$BIN_DIR/picoclaw-base" \
            --head "$BIN_DIR/picoclaw-pr" \
            --output "$RESULTS_DIR"
          benchmark_status=$?
          cat "$RESULTS_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$benchmark_status"

      - name: Upload benchmark data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: picoclaw-runtime-benchmark
          path: ${{ runner.temp }}/picoclaw-benchmark
