name: PR

on:
  pull_request: { }

# A new push to the same PR makes the in-flight run obsolete: cancel it so it
# stops competing for runners (and the disk/CPU the new run needs).
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    env:
      GOLANGCI_LINT_VERSION: v2.14.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run go generate
        run: go generate ./...

      # goinstall rebuilds golangci-lint from source on every run (40-60s on a
      # hosted runner). Cache the binary; lint-cache.yml seeds it from main.
      - name: Restore golangci-lint binary
        id: golangci-bin
        uses: actions/cache@v6
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ env.GOLANGCI_LINT_VERSION }}

      - name: Install golangci-lint
        if: steps.golangci-bin.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The action's own cache is disabled below; this step keeps the analysis
      # cache across pushes and falls back to the one seeded from main.
      - name: Restore golangci-lint analysis cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/golangci-lint
          key: golangci-analysis-${{ runner.os }}-pr-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('.golangci.yaml', 'go.mod', 'go.sum') }}
          restore-keys: |
            golangci-analysis-${{ runner.os }}-pr-${{ env.GOLANGCI_LINT_VERSION }}-
            golangci-analysis-${{ runner.os }}-

      - name: Golangci Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # goinstall is only used on a binary-cache miss above; the action
          # must not reinstall what is already on PATH.
          install-mode: none
          skip-cache: true
          args: --build-tags=goolm,stdjson

  vuln_check:
    name: Security Check
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=goolm,stdjson
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Run Govulncheck
        run: govulncheck -C . -format text ./...

  test:
    name: Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pkg/agent is one huge package and cannot be split by the package
        # scheduler, so give it its own runner and run everything else on
        # another one. Keeping the default -p (one binary per vCPU) avoids
        # oversubscribing timing-sensitive suites, which flake when more
        # binaries than cores compete for CPU.
        shard: [agent, rest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run go generate
        run: go generate ./...

      - name: Select test packages
        id: shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          if [[ "$SHARD" == "agent" ]]; then
            echo "args=./pkg/agent/..." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          selected=()
          for pkg in $(go list ./... \
            | sed 's|^github.com/sipeed/picoclaw$|.|; s|^github.com/sipeed/picoclaw/|./|' \
            | sort); do
            case "$pkg" in
              ./pkg/agent|./pkg/agent/*) continue ;;
            esac
            selected+=("$pkg")
          done
          echo "args=${selected[*]}" >> "$GITHUB_OUTPUT"

      - name: Run go test
        run: go test -tags goolm,stdjson ${{ steps.shard.outputs.args }}

  cross_build:
    name: Cross-Platform Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      # One slow or broken target must not hide the result of the others.
      fail-fast: false
      matrix:
        include:
          - target: linux/amd64
          - target: linux/arm
            goarm: "7"
          - target: linux/arm64
          - target: linux/loong64
          - target: linux/riscv64
          - target: linux/mipsle
            gomips: softfloat
          - target: darwin/arm64
          - target: windows/amd64
          - target: netbsd/amd64
          - target: netbsd/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The build cache is keyed per target below, so let actions/cache own it
          # instead of setup-go's single shared key.
          cache: false

      # Each target compiles the same dependency graph for a different
      # GOOS/GOARCH, so the cache has to be keyed by target to be reusable.
      - name: Restore Go caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ matrix.target }}-
            go-${{ runner.os }}-

      # Linter and unit tests run on the amd64 host, so code that only breaks on
      # 32-bit or exotic targets (e.g. a uint32 vs uint64 mismatch in a syscall
      # field) passes PR checks and only fails once it lands on main. Build every
      # target the release pipeline builds, before merging.
      - name: Build ${{ matrix.target }}
        run: make build-target TARGET=${{ matrix.target }} GOARM=${{ matrix.goarm }} GOMIPS=${{ matrix.gomips }}

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Docker-backed integration suites
        run: bash ./scripts/run-integration-tests.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: web/frontend
        run: pnpm lint

      - name: Type-check and build frontend
        working-directory: web/frontend
        run: pnpm build

  frontend_test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        working-directory: web/frontend
        run: pnpm test
